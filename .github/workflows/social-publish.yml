name: CORE social publishing
on:
  push:
    branches: [main, feature/social-autopublish]
    paths: ['posts/*.html', 'scripts/social_publish.py', 'tests/test_social_publish.py', '.github/workflows/social-publish.yml']
  pull_request:
    paths: ['scripts/social_publish.py', 'tests/test_social_publish.py', '.github/workflows/social-publish.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate accounts without posting, or send one labeled test post'
        type: choice
        options: [validate, test]
        default: validate
      platform:
        description: 'Platform for a labeled test post only'
        type: choice
        options: [bluesky, threads, x]
      test_id:
        description: 'Unique alphanumeric test ID; reuse to prevent duplicate test posts'
        type: string
permissions:
  contents: read
concurrency:
  group: core-social-publishing
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  integrations:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.SOCIAL_PUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate or publish
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SOCIAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
          TEST_PLATFORM: ${{ inputs.platform }}
          TEST_ID: ${{ inputs.test_id }}
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          SOCIAL_ACTIVATION_SHA: ${{ vars.SOCIAL_ACTIVATION_SHA }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          LEDGER_COMMIT: 'true'
        run: python scripts/social_publish.py
